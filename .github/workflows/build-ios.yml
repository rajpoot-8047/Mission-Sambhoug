name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor iOS Assets
        run: npx cap sync ios

      - name: Resolve Swift Package Dependencies
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj

      - name: Build iOS App Binary
        run: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Package Unsigned IPA
        run: |
          cd ios/App
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Mission_Sambhoug_Ludo.ipa Payload
          mv Mission_Sambhoug_Ludo.ipa ../../

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mission_Sambhoug_3D_Ludo_iOS_IPA
          path: Mission_Sambhoug_Ludo.ipa
          retention-days: 14
