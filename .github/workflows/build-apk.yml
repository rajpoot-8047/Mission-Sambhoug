name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p dist
          cp -R public/* dist/

      - name: Sync Capacitor Android Assets
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug -x lint -x test --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Mission_Sambhoug_3D_Ludo.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mission_Sambhoug_3D_Ludo_Android_APK
          path: Mission_Sambhoug_3D_Ludo.apk
          retention-days: 14

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest
          name: "Mission Sambhoug 3D Ludo (Latest Build)"
          body: "Automated Android APK and iOS IPA build containing the latest WebRTC multiplayer deadlock fix and gameplay updates."
          files: Mission_Sambhoug_3D_Ludo.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
